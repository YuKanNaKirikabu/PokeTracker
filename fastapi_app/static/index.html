<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokeTracker — FastAPI</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><header class="top"><a class="logo" href="/">PokeTracker <span>FASTAPI</span></a><nav><button data-view="packs" class="nav active">Паки</button><button data-view="pokedex" class="nav">Покедекс</button><button data-view="favorites" class="nav">Избранное</button></nav><span id="status">Подключение…</span></header>
<main><section id="packs" class="view"><h1>Карты и паки</h1><p class="muted">Поиск этого раздела не связан с поиском Покедекса.</p><div class="searchbar"><input id="packSearch" placeholder="Поиск карты или пака…" autocomplete="off"><button id="clearPack">Очистить</button></div><div id="packResults" class="grid"></div></section>
<section id="pokedex" class="view" hidden><h1>Покедекс</h1><p class="muted">Отдельный поиск, не переносится при переходе из другого раздела.</p><div class="searchbar"><input id="dexSearch" placeholder="Имя покемона или номер…" autocomplete="off"><button id="clearDex">Очистить</button></div><div id="dexResults" class="grid"></div></section>
<section id="favorites" class="view" hidden><h1>Избранное</h1><div id="favoriteResults" class="grid"></div></section><p id="empty" class="muted" hidden>Ничего не найдено. Проверьте наличие data/cards.json.</p></main><script src="/static/app.js" defer></script></body></html>
