<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeTracker</title>
    <link rel="icon" type="image/webp" href="https://storage.yandexcloud.net/poketracker/Images/Icons/Icon.webp">
    <link rel="stylesheet" href="styles.css?v=20261018-2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/widgets/compiler-widget/compiler-widget.css" />
  </head>
  <body>
    <div class="app">
      <header class="site-header">
        <a class="brand" href="#/" id="brandLink" aria-label="Перейти к списку паков" data-i18n-aria="header.brandAria">
          <div class="brand-logo" id="brandLogo">
            <img id="brandLogoImg" src="https://storage.yandexcloud.net/poketracker/Images/MainLogos/TCGM.webp" alt="PokeTracker" />
            <span id="brandLogoText" class="brand-logo-text">TCG</span>
          </div>
          <div class="brand-text">
            <div class="brand-title">PokeTracker</div>
            <div class="brand-subtitle" id="brandSubtitle">PokeTracker</div>
          </div>
        </a>
        <div class="page-title" id="pageTitle" aria-live="polite"></div>
        <div class="pack-header-context" id="packHeaderContext" hidden></div>
        <div class="pokedex-search" id="pokedexSearchWrap">
          <input
            type="text"
            id="pokedexSearchInput"
            placeholder="Поиск покемона или №"
            aria-label="Поиск по покедексу"
            data-i18n-placeholder="header.searchPlaceholder"
            data-i18n-aria="header.searchAria"
          />
        </div>
        <div class="pack-scale-control" id="packScaleControl" hidden></div>
        <div class="header-actions">
          <button class="mobile-filters-toggle" id="mobileFiltersToggle" type="button" aria-expanded="false" aria-label="Открыть фильтры">☷</button>
          <div class="profile-menu" id="profileMenu">
            <button class="profile-toggle" id="profileToggle" type="button" aria-expanded="false" aria-label="Профиль" data-i18n-aria="header.profileMenu">
              <span aria-hidden="true">👤</span>
            </button>
            <div class="profile-dropdown" id="profileDropdown" hidden></div>
          </div>
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="Открыть меню" data-i18n-aria="header.openMenu">
            <img src="https://storage.yandexcloud.net/poketracker/Images/Icons/right_panel.webp" alt="Меню" data-i18n-alt="header.menuAlt" />
          </button>
        </div>
      </header>

      <div class="side-overlay" id="sideOverlay"></div>
      <aside class="side-panel" id="sidePanel" aria-hidden="true">
        <div class="side-panel-header">
          <div>
            <div class="side-panel-title" data-i18n="nav.title">Навигация</div>
            <div class="side-panel-subtitle">PokeTracker</div>
          </div>
          <button class="side-close" id="sideClose" type="button" aria-label="Закрыть меню" data-i18n-aria="header.closeMenu">✕</button>
        </div>
        <nav class="side-nav">
          <a href="#/" class="nav-link" data-i18n="nav.home">Главная</a>
          <a href="#/mobile" class="nav-link" data-i18n="nav.mobile">Мобильная версия</a>
          <a href="#/physical" class="nav-link" data-i18n="nav.physical">Физическое издание</a>
          <a href="#/collection" class="nav-link" data-i18n="nav.collection">Коллекция</a>
          <a href="#/wishlist" class="nav-link" data-i18n="nav.wishlist">Вишлист</a>
          <a href="#/pokedex" class="nav-link" data-i18n="nav.pokedex">Покедекс</a>
          <a href="#/projects" class="nav-link" data-i18n="nav.projects">Проекты</a>
          <a href="#/settings" class="nav-link" data-i18n="nav.settings">Настройки</a>
          <a href="#/profile" class="nav-link" data-i18n="nav.profile">Профиль</a>
        </nav>
      </aside>

      <main class="content" id="app"></main>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
